name: Offline tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned offline test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Offline regression (synthetic inputs, no model calls)
        run: python -B -X utf8 -m unittest discover -s tests -v
      - name: Staged first-delivery revocation checks
        run: python -B -X utf8 -S -m unittest experiments.pre_delivery_revocation.test_driver -v
      - name: Persistent exchange offline tests with live inference disabled
        run: python -I -B -X utf8 -S scripts/run_persistent_exchange_offline_tests.py
      - name: Recompute published bidirectional exchange scores
        run: python -I -B -X utf8 -S scripts/export_persistent_exchange_public.py --verify
      - name: Verify the seven preceding aggregate result projections
        run: python -I -B -X utf8 -S benchmarks/prior_experiments_public_20261105/verify.py
      - name: Recompute published native-client evidence without API access
        run: python -I -B -S benchmarks/pre_delivery_revocation_metadata_20261101/reproduce.py

