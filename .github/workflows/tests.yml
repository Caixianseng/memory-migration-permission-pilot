name: Offline tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned offline test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Offline regression (synthetic inputs, no model calls)
        run: python -B -X utf8 -m unittest discover -s tests -v
